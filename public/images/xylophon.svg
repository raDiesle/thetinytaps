  <rect x="50"  y="36" width="20" height="92"  rx="6" fill="#ff8c42"/>
  <rect x="76"  y="42" width="20" height="80"  rx="6" fill="#ffb703"/>
  <rect x="102" y="48" width="20" height="68"  rx="6" fill="#3ec300"/>
  <rect x="128" y="54" width="20" height="56"  rx="6" fill="#00b4d8"/>
  <rect x="154" y="60" width="20" height="44"  rx="6" fill="#8e7dff"/>

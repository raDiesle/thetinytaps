    <circle cx="34" cy="40" r="3"/><circle cx="34" cy="124" r="3"/>
    <circle cx="60" cy="46" r="3"/><circle cx="60" cy="118" r="3"/>
    <circle cx="86" cy="52" r="3"/><circle cx="86" cy="112" r="3"/>
    <circle cx="112" cy="58" r="3"/><circle cx="112" cy="106" r="3"/>
    <circle cx="138" cy="64" r="3"/><circle cx="138" cy="100" r="3"/>

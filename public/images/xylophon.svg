  <!-- mallets -->
  <line x1="120" y1="150" x2="170" y2="118" stroke="#8d5a2b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="172" cy="116" r="9" fill="#e63946"/>
  <line x1="80" y1="150" x2="40" y2="122" stroke="#8d5a2b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="37" cy="120" r="9" fill="#e63946"/>

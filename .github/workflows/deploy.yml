name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, as in GitHub's own Pages starter workflow: a newer push replaces a run still waiting in the
# queue, but a run already going is left to finish, so a deploy is never killed half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A whole run takes about a minute and a half: one that hangs stops here, not after GitHub's 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # The version in package.json's packageManager.
          bun-version-file: package.json
      # Exactly what bun.lock says, with the safety settings of bunfig.toml (no install scripts, 3 days old).
      - run: bun install --frozen-lockfile
      # GitHub sets CI=true: tests that take seconds (`heavyTest`, src/heavyTest.ts) are skipped here, they ran before the commit.
      - run: bun run verify
      # The site is served from the root of https://www.funforboth.com (repo settings → Pages → Custom domain).
      - run: bun run build
        env:
          # Cloudflare Web Analytics' site token: Settings → Secrets and variables → Actions → Variables.
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Handing the artifact to Pages takes seconds; a deploy stuck waiting for Pages gives up here.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
